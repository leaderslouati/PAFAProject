# =============================================================================
# PAFA Data Ingestion — Kubernetes CronJob (LOCAL / Docker Desktop)
#
# Pré-requis :
#   1. Activer Kubernetes dans Docker Desktop ? Settings ? Kubernetes ? Enable
#   2. L'infra Docker Compose doit tourner (PostgreSQL, SFTP, MinIO) :
#        docker network create pafa_network
#        docker compose up -d
#
# Usage :
#   # 1. Builder l'image locale
#   docker build -t pafa-batch:local -f src/PAFA.BatchReports/Dockerfile .
#
#   # 2. Déployer le CronJob
#   kubectl apply -f src/PAFA.BatchReports/cronjob-local.yaml
#
#   # 3. Surveiller (le job se lance automatiquement au prochain créneau)
#   kubectl get jobs -w
#   kubectl logs -f -l app=pafa-batch
#
#   # 4. Nettoyer après test
#   kubectl delete -f src/PAFA.BatchReports/cronjob-local.yaml
#
# ??? ASTUCE : changer le schedule pour tester immédiatement ???????????????????
#   Exemple : il est 15:35, vous voulez que ça se lance à 15:37
#     schedule: "37 15 * * *"
#
#   Format cron : MINUTE HEURE JOUR_MOIS MOIS JOUR_SEMAINE
#     "*/2 * * * *"    ? toutes les 2 minutes (stress test)
#     "37 15 * * *"    ? tous les jours à 15:37
#     "0 2 1 * *"      ? le 1er du mois à 02:00 (production)
#     "37 15 21 3 *"   ? le 21 mars à 15:37 (date précise)
# =============================================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: pafa-ingestion-cronjob
spec:
  # ??????????????????????????????????????????????????????????????????
  #  SCHEDULE — Modifier ici pour tester sans attendre
  #
  #  Pour tester MAINTENANT : regardez votre horloge, ajoutez 2 min
  #  Exemple : il est 15:35 ? mettez "37 15 * * *"
  #
  #  Production : "0 2 1 * *" (1er du mois à 02:00 UTC)
  # ??????????????????????????????????????????????????????????????????
  schedule: "*/2 * * * *"   # ? TOUTES LES 2 MIN (pour test local)
  # schedule: "0 2 1 * *"   # ? PRODUCTION (1er du mois à 02:00 UTC)

  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: pafa-batch
        spec:
          restartPolicy: Never

          containers:
          - name: pafa-batch
            image: pafa-batch:local
            imagePullPolicy: Never

            # Ingestion uniquement (SFTP ? MinIO ? Parse ? Validate ? Insert)
            args: ["--ingest"]

            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"

            env:
            # .NET
            - name: DOTNET_ENVIRONMENT
              value: "Production"

            # Database — host.docker.internal = votre machine hôte (Docker Desktop)
            - name: PAFA_ConnectionStrings__DefaultConnection
              value: "Host=host.docker.internal;Port=5432;Database=pafadb;Username=postgres;Password=postgres"

            # SFTP — pointe vers le container SFTP local (port mappé 2222)
            - name: PAFA_Sftp__Host
              value: "host.docker.internal"
            - name: PAFA_Sftp__Port
              value: "2222"
            - name: PAFA_Sftp__Username
              value: "xoserve"
            - name: PAFA_Sftp__Password
              value: "xoserve_pass"
            - name: PAFA_Sftp__RemotePath
              value: "/upload"
            - name: PAFA_Sftp__ProcessedPath
              value: "/processed"
            - name: PAFA_Sftp__FailedPath
              value: "/failed"

            # Blob Storage — MinIO local (port mappé 9000)
            - name: PAFA_BlobStorage__Provider
              value: "MinIO"
            - name: PAFA_BlobStorage__Endpoint
              value: "host.docker.internal:9000"
            - name: PAFA_BlobStorage__AccessKey
              value: "minioadmin"
            - name: PAFA_BlobStorage__SecretKey
              value: "minioadmin"
            - name: PAFA_BlobStorage__UseSsl
              value: "false"
