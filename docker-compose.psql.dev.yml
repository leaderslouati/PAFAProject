services:
  db:
    image: postgres:15-alpine
    container_name: pafa_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pafadb
    ports:
      - "5432:5432"
    volumes:
      - pafa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pafadb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pafa_pg_data: