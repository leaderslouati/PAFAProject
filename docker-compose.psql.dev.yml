services:
  db:
    image: postgres:16-alpine
    container_name: pafa_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pafadb
    volumes:
      - pafa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pafadb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

volumes:
  pafa_pg_data:

networks:
  default:
    name: pafa_network
    external: true