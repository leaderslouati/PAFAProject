name: pafa-project

# On inclut la base de données
include:
  - docker-compose.psql.dev.yml

services:
  # 1. Le Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pafa_rabbitmq
    ports:
      - "5672:5672"   # Port AMQP pour .NET
      - "15672:15672" # Interface Web de management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Service SFTP pour les rapports
  pafa-sftp:
    image: atmoz/sftp
    container_name: pafa_sftp
    ports:
      - "2222:22"
    volumes:
      - ./sftp-data/upload:/home/xoserve/upload
      - ./sftp-data/processed:/home/xoserve/processed
    command: xoserve:xoserve_pass:1001
    networks:
      default:
        aliases:
          - pafa_sftp

  # 3. Service pour les rapports par lots
  pafa-batch-reports:
    build:
      context: .
      dockerfile: src/PAFA.BatchReports/Dockerfile
    image: pafa-batch-reports:latest
    container_name: pafa_batch_reports
    environment:
      - DOTNET_ENVIRONMENT=Production
      - PAFA_ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=pafadb;Username=postgres;Password=postgres
      - PAFA_BatchReports__OutputDirectory=/app/output/reports
      - PAFA_BatchReports__TempDirectory=/app/output/reports/temp
    volumes:
      - pafa_reports_data:/app/output/reports
    depends_on:
      db:
        condition: service_healthy

volumes:
  pafa_reports_data:

networks:
  default:
    name: pafa_network